<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
  </defs>

  <!-- dark rounded square bg -->
  <rect width="120" height="120" rx="18" fill="#0f1220"/>

  <!-- halo circle -->
  <circle cx="60" cy="44" r="30" fill="none" stroke="url(#g1)" stroke-width="3.5" opacity="0.9"/>

  <!-- stylized pi symbol -->
  <g transform="translate(0,6)">
    <path d="M22 46 L98 46" stroke="url(#g1)" stroke-width="6" stroke-linecap="round" />
    <path d="M32 46 C32 28,44 24,60 24 C76 24,88 28,88 46" stroke="url(#g1)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M48 46 L48 78" stroke="url(#g1)" stroke-width="6" stroke-linecap="round" />
    <path d="M72 46 L72 78" stroke="url(#g1)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- soft glow -->
  <circle cx="60" cy="44" r="36" fill="url(#g1)" opacity="0.06" />
</svg>
