{% extends "base.html" %}
{% block title %}Login · Pi Skill Market{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="p-4 glass-card fade-in">
      <h2 class="mb-3 text-center gradient-text">Welcome back</h2>
      <p class="text-center small-muted mb-4">Login to manage your skills</p>
      
      <!-- Error message (agar koi ho to) -->
      {% if error %}
        <div class="alert alert-danger text-center">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" name="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
      </form>

      <div class="text-center mt-3 small">
        New here? <a href="{{ url_for('register') }}">Create an account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
