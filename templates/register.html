{% extends "base.html" %}
{% block title %}Register · Pi Skill Market{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="p-4 glass-card fade-in">
      <h2 class="mb-3 text-center gradient-text">Create your account</h2>
      <p class="text-center small-muted mb-4">Join the marketplace of skills</p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" name="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button class="btn btn-primary w-100">Create Account</button>
      </form>
      <div class="text-center mt-3 small">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
