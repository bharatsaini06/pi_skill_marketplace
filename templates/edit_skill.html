{% extends "base.html" %}
{% block title %}Edit Skill · Pi Skill Marketplace{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="p-4 glass-card fade-in">
      <h4 class="mb-3">Edit Skill</h4>
      <form method="POST" action="{{ url_for('edit_skill', skill_id=skill.id) }}">
        <div class="mb-3">
          <label class="form-label">Skill Name</label>
          <input type="text" class="form-control" name="name" value="{{ skill.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description" rows="4" required>{{ skill.description }}</textarea>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Save changes</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
